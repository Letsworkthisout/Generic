<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tracker</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
 background:linear-gradient(135deg,#667eea,#764ba2);min-height:100vh;padding:10px;color:#222;}
.container{max-width:460px;margin:0 auto;background:#fff;border-radius:18px;
 box-shadow:0 10px 30px rgba(0,0,0,.3);overflow:hidden;padding-bottom:62px;position:relative;min-height:70vh;}
.tab{display:none;padding-top:8px;}
.tab.active{display:block;}

.box{border-radius:12px;margin:10px 12px;overflow:hidden;}
.box-head{display:flex;justify-content:space-between;align-items:center;padding:5px 12px;font-weight:800;font-size:15px;}
.box-head span{font-size:11px;font-weight:600;color:#777;}
.pair{display:grid;grid-template-columns:1fr 1fr;}
.cell{padding:8px;text-align:center;}
.cell+.cell{border-left:1px solid #eee;}
.bar{height:5px;border-radius:3px;margin-bottom:6px;}
.mg{font-weight:700;font-size:13px;}
.rem{font-size:21px;font-weight:800;line-height:1.1;margin-top:1px;}
.rem small{font-size:12px;color:#999;font-weight:600;}
.dl{font-size:11px;font-weight:700;margin:2px 0 0;}
.tiny{font-size:10px;color:#9a9a9a;}
.log{width:100%;border:none;border-radius:8px;padding:9px 0;font-weight:700;font-size:14px;cursor:pointer;margin-top:6px;}
.log:active{transform:scale(.96);}
.log:disabled{background:#d8d8d8 !important;color:#999 !important;}

.today{display:flex;gap:8px;margin:4px 12px 8px;}
.tcard{flex:1;border-radius:10px;padding:9px;text-align:center;}
.tcard b{display:block;font-size:17px;}
.tcard span{font-size:10px;color:#777;}

.section{padding:12px 16px;}
.section h2{font-size:14px;margin-bottom:10px;color:#333;}
.field{margin-bottom:10px;}
.field label{display:block;font-size:12px;font-weight:600;margin-bottom:4px;color:#555;}
.field input{width:100%;padding:9px;border:2px solid #e2e2e2;border-radius:8px;font-size:14px;}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
.grid2 label{font-size:11px;}

.day{padding:7px 0;border-bottom:1px solid #e6e6e6;}
.day-head{display:flex;justify-content:space-between;align-items:baseline;font-size:13px;}
.day-head .dt{font-weight:700;}
.day-head .tot b{font-weight:800;}
.entry{display:flex;justify-content:space-between;font-size:13px;color:#444;padding:3px 2px 3px 6px;cursor:pointer;}
.entry:active{background:#f2f2f2;}
.chip{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:5px;vertical-align:middle;border:1px solid #ddd;}

.chart-wrap{position:relative;margin:6px 10px;}
.chart-toggle{position:absolute;top:2px;left:2px;display:flex;gap:4px;z-index:2;}
.ct{font-size:11px;font-weight:700;border:1px solid #ccc;background:#fff;border-radius:6px;padding:3px 8px;cursor:pointer;color:#555;}
.ct.on{background:#333;color:#fff;border-color:#333;}

.sync-row{display:flex;gap:8px;}.sync-row input{flex:1;}
.btn{border:none;border-radius:8px;padding:10px 12px;font-weight:600;color:#fff;cursor:pointer;font-size:13px;}
.b-blue{background:#2962ff;}.b-green{background:#2e7d32;}.b-gray{background:#666;}.b-red{background:#d32f2f;}
.status{font-size:12px;margin-top:8px;color:#555;min-height:16px;}
.muted{font-size:12px;color:#888;}

.tabbar{position:absolute;bottom:0;left:0;right:0;display:flex;background:#fff;border-top:1px solid #eee;}
.tabbtn{flex:1;border:none;background:none;padding:10px 0;font-size:12px;font-weight:600;color:#999;cursor:pointer;}
.tabbtn.on{color:#2962ff;}
.tabbtn b{display:block;font-size:17px;line-height:1;margin-bottom:2px;}

.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:center;justify-content:center;padding:14px;z-index:100;}
.modal-content{background:#fff;padding:20px;border-radius:14px;width:100%;max-width:360px;}
.modal h3{text-align:center;margin-bottom:16px;}
.modal-btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px;}
.modal-btns .btn{flex:1;min-width:84px;padding:12px;}
</style>
</head>
<body>
<div class="container">

  <!-- HOME -->
  <div class="tab active" id="tab-home">
    <div id="boxes"></div>
    <div class="today" id="todayTotals"></div>
    <div class="section" style="padding-top:0"><h2>Today's log</h2><div id="todayLog"></div></div>
    <div class="section" style="padding-top:0"><div class="field"><label>Note</label><input id="notesHome" placeholder="Notes"></div></div>
  </div>

  <!-- DATA -->
  <div class="tab" id="tab-data">
    <div class="section">
      <h2>Totals</h2>
      <div class="today" id="dataTotals" style="margin:0 0 10px"></div>
      <h2>By day</h2>
      <div id="table"></div>
    </div>
    <div class="section" style="padding-top:0"><div class="field"><label>Note</label><input id="notesData" placeholder="Notes"></div></div>
  </div>

  <!-- CHART -->
  <div class="tab" id="tab-chart">
    <div class="chart-wrap">
      <div class="chart-toggle">
        <button class="ct on" id="ct-both" onclick="setChartMode('both')">Both</button>
        <button class="ct" id="ct-L" onclick="setChartMode('L')">L</button>
        <button class="ct" id="ct-A" onclick="setChartMode('A')">A</button>
      </div>
      <div id="chartSvg"></div>
    </div>
    <p class="muted" style="margin:4px 16px 0">Shaded = 4 days before O / before P. Set O and P in Setup.</p>
  </div>

  <!-- SETUP -->
  <div class="tab" id="tab-setup">
    <div class="section">
      <h2>Pack sizes</h2>
      <div class="grid2">
        <div class="field"><label>L 30 mg</label><input type="number" min="0" id="t-L-30"></div>
        <div class="field"><label>L 20 mg</label><input type="number" min="0" id="t-L-20"></div>
        <div class="field"><label>A 40 mg</label><input type="number" min="0" id="t-A-40"></div>
        <div class="field"><label>A 18 mg</label><input type="number" min="0" id="t-A-18"></div>
      </div>
    </div>
    <div class="section" style="padding-top:0">
      <h2>Due dates</h2>
      <div class="grid2" id="dueGrid"></div>
    </div>
    <div class="section" style="padding-top:0">
      <h2>Cycle dates</h2>
      <div class="grid2">
        <div class="field"><label>O date</label><input type="date" id="oDate"></div>
        <div class="field"><label>P date</label><input type="date" id="pDate"></div>
      </div>
      <p class="muted">O and P repeat every 28 days to predict the future. When a real one lands early or late, update it here to resync.</p>
    </div>
    <div class="section" style="padding-top:0">
      <h2>Cloud sync (optional)</h2>
      <div class="field"><label>Project URL</label><input id="supaUrl" placeholder="https://xxxx.supabase.co"></div>
      <div class="field"><label>Anon public key</label><input id="supaKey" placeholder="eyJ..."></div>
      <div class="sync-row"><input id="syncCode" placeholder="Your code (any word)"><button class="btn b-blue" onclick="loadByCode()">Load</button></div>
      <div class="modal-btns" style="margin-top:8px">
        <button class="btn b-green" onclick="connectSave()">Connect &amp; save</button>
        <button class="btn b-gray" onclick="exportCSV()">Export CSV</button>
      </div>
      <div class="status" id="syncStatus"></div>
    </div>
  </div>

  <div class="tabbar">
    <button class="tabbtn on" id="nav-home" onclick="showTab('home')"><b>🏠</b>Home</button>
    <button class="tabbtn" id="nav-data" onclick="showTab('data')"><b>📋</b>Data</button>
    <button class="tabbtn" id="nav-chart" onclick="showTab('chart')"><b>📈</b>Chart</button>
    <button class="tabbtn" id="nav-setup" onclick="showTab('setup')"><b>⚙︎</b>Setup</button>
  </div>
</div>

<!-- Dose edit modal -->
<div id="doseModal" class="modal">
  <div class="modal-content">
    <h3 id="doseTitle">Edit</h3>
    <div class="field"><label>Date</label><input type="date" id="doseDate"></div>
    <div class="field"><label>Time</label><input type="time" id="doseTime"></div>
    <div class="modal-btns">
      <button class="btn b-blue" onclick="saveDose()">Save</button>
      <button class="btn b-red" onclick="deleteDose()">Delete</button>
      <button class="btn b-gray" onclick="closeModal('doseModal')">Cancel</button>
    </div>
  </div>
</div>

<script>
const ITEMS=[
  {key:'L-30',grp:'L',mg:30,accent:'#FF1493',text:'#fff'},
  {key:'L-20',grp:'L',mg:20,accent:'#FFF9C4',text:'#333'},
  {key:'A-40',grp:'A',mg:40,accent:'#2979FF',text:'#fff'},
  {key:'A-18',grp:'A',mg:18,accent:'#FFEA00',text:'#333'},
];
const GRP_COLOR={L:'#FF1493',A:'#2979FF'};
const BORDER={L:'#F4A6C8',A:'#A9C6FF'};
const DOW=['S','M','T','W','T','F','S'];

let data=blank(), currentEdit=null, pushTimer=null, chartMode='both';

function blank(){const d={notes:'',oDate:'',pDate:'',totals:{},due:{},doses:{}};
  ITEMS.forEach(s=>{d.totals[s.key]=28;d.due[s.key]='';d.doses[s.key]=[];});return d;}

window.addEventListener('load',()=>{
  loadLocal();
  bindInputs();
  const u=localStorage.getItem('supaUrl')||'',k=localStorage.getItem('supaKey')||'',c=localStorage.getItem('trackerCode')||'';
  el('supaUrl').value=u;el('supaKey').value=k;el('syncCode').value=c;
  fillSetup();
  render();
  if(u&&k&&c) pull(u,k,c,true);
});

function el(id){return document.getElementById(id);}
function loadLocal(){try{const s=localStorage.getItem('trackerData');
  if(s){const p=JSON.parse(s);data=Object.assign(blank(),p);
    ITEMS.forEach(x=>{data.totals[x.key]??=28;data.due[x.key]??='';if(!Array.isArray(data.doses[x.key]))data.doses[x.key]=[];});}
  }catch(e){}}
function save(){try{localStorage.setItem('trackerData',JSON.stringify(data));}catch(e){}
  const u=localStorage.getItem('supaUrl'),k=localStorage.getItem('supaKey'),c=localStorage.getItem('trackerCode');
  if(u&&k&&c){clearTimeout(pushTimer);pushTimer=setTimeout(()=>push(u,k,c),800);}}

function bindInputs(){
  el('notesHome').addEventListener('input',e=>{data.notes=e.target.value;el('notesData').value=e.target.value;save();});
  el('notesData').addEventListener('input',e=>{data.notes=e.target.value;el('notesHome').value=e.target.value;save();});
  ITEMS.forEach(s=>el('t-'+s.key).addEventListener('input',e=>{const v=parseInt(e.target.value);data.totals[s.key]=isNaN(v)?0:v;save();render();}));
  el('oDate').addEventListener('change',e=>{data.oDate=e.target.value;save();drawChart();});
  el('pDate').addEventListener('change',e=>{data.pDate=e.target.value;save();drawChart();});
}
function fillSetup(){
  el('notesHome').value=data.notes;el('notesData').value=data.notes;
  ITEMS.forEach(s=>el('t-'+s.key).value=data.totals[s.key]);
  el('oDate').value=data.oDate;el('pDate').value=data.pDate;
  const g=el('dueGrid');g.innerHTML='';
  ITEMS.forEach(s=>{const d=document.createElement('div');d.className='field';
    d.innerHTML=`<label>${s.grp} ${s.mg} mg</label><input type="date" value="${data.due[s.key]||''}" onchange="setDue('${s.key}',this.value)">`;g.appendChild(d);});
}
function setDue(k,v){data.due[k]=v;save();render();}

function remaining(k){return Math.max(0,(data.totals[k]||0)-data.doses[k].length);}
function daysLeft(k){if(!data.due[k])return null;const t=new Date();t.setHours(0,0,0,0);return Math.ceil((parseLocal(data.due[k])-t)/86400000);}
function daysColor(n){if(n===null)return '#aaa';if(n<0||n<=2)return '#d32f2f';if(n<=6)return '#f57c00';return '#2e7d32';}
function parseLocal(s){const p=s.split('-');return new Date(+p[0],+p[1]-1,+p[2]);}
function fmt(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
function localDay(ts){return fmt(new Date(ts));}
function todayStr(){return fmt(new Date());}

function render(){renderHome();renderData();drawChart();}

function renderHome(){
  const wrap=el('boxes');wrap.innerHTML='';
  ['L','A'].forEach(grp=>{
    const items=ITEMS.filter(i=>i.grp===grp);
    const left=items.reduce((a,s)=>a+remaining(s.key),0);
    const box=document.createElement('div');box.className='box';box.style.border='2px solid '+BORDER[grp];
    box.innerHTML=`<div class="box-head" style="color:${GRP_COLOR[grp]}">${grp}<span>${left} left</span></div>`;
    const pair=document.createElement('div');pair.className='pair';
    items.forEach(s=>{
      const rem=remaining(s.key),dl=daysLeft(s.key),remMg=rem*s.mg,totMg=(data.totals[s.key]||0)*s.mg;
      const dlText=dl===null?'set due in setup':(dl<0?`overdue ${Math.abs(dl)}d`:(dl===0?'due today':`${dl} days left`));
      const cell=document.createElement('div');cell.className='cell';
      cell.innerHTML=`<div class="bar" style="background:${s.accent}"></div>
        <div class="mg">${s.mg} mg</div>
        <div class="rem">${rem}<small>/${data.totals[s.key]||0}</small></div>
        <div class="dl" style="color:${daysColor(dl)}">${dlText}</div>
        <div class="tiny">(${remMg}/${totMg} mg)</div>
        <button class="log" style="background:${s.accent};color:${s.text}" ${rem===0?'disabled':''} onclick="takeOne('${s.key}')">Log</button>`;
      pair.appendChild(cell);
    });
    box.appendChild(pair);wrap.appendChild(box);
  });
  // today totals
  const td=todayStr();const t=groupTotalsForDay(td);
  el('todayTotals').innerHTML=todayCards(t);
  // today log
  const rows=allDoses().filter(r=>localDay(r.ts)===td).sort((a,b)=>new Date(b.ts)-new Date(a.ts));
  el('todayLog').innerHTML=rows.length?rows.map(r=>entryHtml(r)).join(''):'<p class="muted">Nothing logged today.</p>';
}
function todayCards(t){
  return `<div class="tcard" style="background:#FDE7F1"><b style="color:${GRP_COLOR.L}">${t.L.ct} · ${t.L.mg}mg</b><span>L today</span></div>
          <div class="tcard" style="background:#E5EEFF"><b style="color:${GRP_COLOR.A}">${t.A.ct} · ${t.A.mg}mg</b><span>A today</span></div>`;
}
function groupTotalsForDay(dayStr){
  const t={L:{ct:0,mg:0},A:{ct:0,mg:0}};
  ITEMS.forEach(s=>data.doses[s.key].forEach(d=>{if(localDay(d.ts)===dayStr){t[s.grp].ct++;t[s.grp].mg+=s.mg;}}));
  return t;
}
function allDoses(){const r=[];ITEMS.forEach(s=>data.doses[s.key].forEach(d=>r.push({...d,grp:s.grp,mg:s.mg,accent:s.accent,key:s.key})));return r;}
function entryHtml(r){const dt=new Date(r.ts);
  return `<div class="entry" onclick="openEdit('${r.key}','${r.id}')"><span><span class="chip" style="background:${r.accent}"></span>${dt.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})}</span><span>${r.grp} ${r.mg}mg</span></div>`;}

function renderData(){
  // grand totals
  let lMg=0,aMg=0,lCt=0,aCt=0;
  ITEMS.forEach(s=>{const c=data.doses[s.key].length,m=c*s.mg;if(s.grp==='L'){lMg+=m;lCt+=c;}else{aMg+=m;aCt+=c;}});
  el('dataTotals').innerHTML=`<div class="tcard" style="background:#FDE7F1"><b style="color:${GRP_COLOR.L}">${lMg}mg</b><span>L · ${lCt} logged</span></div>
    <div class="tcard" style="background:#E5EEFF"><b style="color:${GRP_COLOR.A}">${aMg}mg</b><span>A · ${aCt} logged</span></div>`;
  // by day
  const rows=allDoses();
  const byDay={};
  rows.forEach(r=>{const d=localDay(r.ts);(byDay[d]=byDay[d]||[]).push(r);});
  const days=Object.keys(byDay).sort((a,b)=>b.localeCompare(a));
  let html='';
  if(!days.length){html='<p class="muted">Nothing logged yet.</p>';}
  days.forEach(d=>{
    const list=byDay[d].sort((a,b)=>new Date(b.ts)-new Date(a.ts));
    let L=0,A=0;list.forEach(r=>{if(r.grp==='L')L++;else A++;});
    const dt=parseLocal(d);
    html+=`<div class="day"><div class="day-head"><span class="dt">${DOW[dt.getDay()]} ${dt.getDate()}/${dt.getMonth()+1}</span>
      <span class="tot"><b style="color:${GRP_COLOR.L}">L ${L}</b> · <b style="color:${GRP_COLOR.A}">A ${A}</b></span></div>`;
    html+=list.map(r=>entryHtml(r)).join('');
    html+='</div>';
  });
  el('table').innerHTML=html;
}

function takeOne(k){data.doses[k].push({id:uid(),ts:new Date().toISOString()});save();render();}
function openEdit(key,id){currentEdit={key,id};const s=ITEMS.find(x=>x.key===key);const ts=new Date(data.doses[key].find(d=>d.id===id).ts);
  el('doseTitle').textContent=`${s.grp} · ${s.mg} mg`;el('doseDate').value=ts.toISOString().split('T')[0];el('doseTime').value=ts.toTimeString().slice(0,5);
  el('doseModal').style.display='flex';}
function saveDose(){const dv=el('doseDate').value,tv=el('doseTime').value;if(!dv||!tv){alert('Set date and time');return;}
  data.doses[currentEdit.key].find(d=>d.id===currentEdit.id).ts=new Date(`${dv}T${tv}`).toISOString();save();render();closeModal('doseModal');}
function deleteDose(){if(!confirm('Delete this entry?'))return;
  data.doses[currentEdit.key]=data.doses[currentEdit.key].filter(d=>d.id!==currentEdit.id);save();render();closeModal('doseModal');}

// ---------- CHART ----------
function winStart(){const t=new Date();t.setHours(0,0,0,0);t.setDate(t.getDate()-13);return t;}
function dayIdxOf(dateStr){return Math.round((parseLocal(dateStr)-winStart())/86400000);}
function waveVal(t){
  if(!data.oDate||!data.pDate)return null;
  const o0=dayIdxOf(data.oDate),p0=dayIdxOf(data.pDate);const anchors=[];
  for(let k=-2;k<=2;k++){anchors.push({t:o0+28*k,v:1});anchors.push({t:p0+28*k,v:-1});}
  anchors.sort((a,b)=>a.t-b.t);
  if(t<=anchors[0].t)return anchors[0].v;if(t>=anchors[anchors.length-1].t)return anchors[anchors.length-1].v;
  let a,b;for(let i=0;i<anchors.length-1;i++){if(anchors[i].t<=t&&anchors[i+1].t>=t){a=anchors[i];b=anchors[i+1];break;}}
  if(!a)return 0;if(b.t===a.t)return a.v;const tp=(t-a.t)/(b.t-a.t);return a.v*Math.cos(Math.PI*tp);
}
function setChartMode(m){chartMode=m;['both','L','A'].forEach(x=>el('ct-'+x).classList.toggle('on',x===m));drawChart();}
function drawChart(){
  const W=360,H=215,L=24,R=8,N=28,top=16,yb=175,plotW=W-L-R,cw=plotW/N,mid=100,amp=70;
  const start=winStart();
  // per-day counts
  const cnt=[];for(let i=0;i<N;i++){const d=new Date(start);d.setDate(d.getDate()+i);const ds=fmt(d);let l=0,a=0;
    ITEMS.forEach(s=>data.doses[s.key].forEach(x=>{if(localDay(x.ts)===ds){if(s.grp==='L')l++;else a++;}}));cnt.push({ds,d,l,a});}
  const x=i=>L+i*cw+cw/2;
  let s='<svg viewBox="0 0 '+W+' '+H+'" width="100%" xmlns="http://www.w3.org/2000/svg">';
  // highlight bands: 4 days before each projected O and P
  function bands(anchorStr,color){if(!anchorStr)return '';let out='';const base=dayIdxOf(anchorStr);
    for(let k=-1;k<=2;k++){const idx=base+28*k;for(let j=idx-4;j<idx;j++){if(j>=0&&j<N){out+='<rect x="'+(L+j*cw)+'" y="'+top+'" width="'+cw+'" height="'+(yb-top)+'" fill="'+color+'"/>';}}
      if(idx>=0&&idx<N){out+='<text x="'+x(idx)+'" y="'+(top+10)+'" text-anchor="middle" font-size="10" font-weight="700" fill="#555">'+(color==='rgba(255,171,0,.18)'?'O':'P')+'</text>';}}
    return out;}
  s+=bands(data.oDate,'rgba(255,171,0,.18)');
  s+=bands(data.pDate,'rgba(233,30,99,.14)');
  // week vertical lines (Mondays)
  for(let i=0;i<N;i++){if(cnt[i].d.getDay()===1){s+='<line x1="'+(L+i*cw)+'" y1="'+top+'" x2="'+(L+i*cw)+'" y2="'+yb+'" stroke="#d7d7d7" stroke-width="1"/>';}}
  // today line (index 13)
  s+='<line x1="'+x(13)+'" y1="'+top+'" x2="'+x(13)+'" y2="'+yb+'" stroke="#bbb" stroke-width="1" stroke-dasharray="3,3"/>';
  // wave
  if(data.oDate&&data.pDate){let pts='';for(let f=-0.5;f<=N-0.5;f+=0.5){const v=waveVal(f);const px=L+f*cw+cw/2;const py=mid-v*amp;pts+=(pts?' L':'M')+px.toFixed(1)+','+py.toFixed(1);}
    s+='<path d="'+pts+'" fill="none" stroke="#7F77DD" stroke-width="2"/>';}
  // baseline
  s+='<line x1="'+L+'" y1="'+yb+'" x2="'+(W-R)+'" y2="'+yb+'" stroke="#c3c2b7" stroke-width="1"/>';
  // bars
  const unit=16,cap=120,bw=cw*0.3;
  cnt.forEach((c,i)=>{
    if(chartMode!=='A'&&c.l>0){const h=Math.min(cap,c.l*unit);s+='<rect x="'+(x(i)-bw-1)+'" y="'+(yb-h)+'" width="'+bw+'" height="'+h+'" rx="1" fill="'+GRP_COLOR.L+'"/>';}
    if(chartMode!=='L'&&c.a>0){const h=Math.min(cap,c.a*unit);s+='<rect x="'+(x(i)+1)+'" y="'+(yb-h)+'" width="'+bw+'" height="'+h+'" rx="1" fill="'+GRP_COLOR.A+'"/>';}
  });
  // day-of-week letters
  cnt.forEach((c,i)=>{s+='<text x="'+x(i)+'" y="'+(yb+14)+'" text-anchor="middle" font-size="8" fill="#999">'+DOW[c.d.getDay()]+'</text>';});
  s+='</svg>';
  el('chartSvg').innerHTML=s;
}

// ---------- tabs ----------
function showTab(name){['home','data','chart','setup'].forEach(n=>{el('tab-'+n).classList.toggle('active',n===name);el('nav-'+n).classList.toggle('on',n===name);});
  if(name==='chart')drawChart();}

// ---------- Supabase sync ----------
function setStatus(m){el('syncStatus').textContent=m;}
function val(id){return (el(id).value||'').trim();}
function headers(key,extra){return Object.assign({apikey:key,'Authorization':'Bearer '+key,'Content-Type':'application/json'},extra||{});}
function rememberCfg(u,k,c){localStorage.setItem('supaUrl',u);localStorage.setItem('supaKey',k);localStorage.setItem('trackerCode',c);}
async function connectSave(){const u=val('supaUrl'),k=val('supaKey'),c=val('syncCode');if(!u||!k||!c){setStatus('Fill in URL, key and a code first.');return;}
  setStatus('Saving…');try{const res=await fetch(u+'/rest/v1/boards',{method:'POST',headers:headers(k,{'Prefer':'resolution=merge-duplicates'}),body:JSON.stringify({code:c,data})});
    if(!res.ok)throw new Error();rememberCfg(u,k,c);setStatus('Connected & saved. It now auto-saves from here.');}catch(e){setStatus('Save failed — check URL/key and that you ran the setup SQL.');}}
async function loadByCode(){const u=val('supaUrl'),k=val('supaKey'),c=val('syncCode');if(!u||!k||!c){setStatus('Fill in URL, key and a code first.');return;}pull(u,k,c,false);}
async function pull(u,k,c,silent){if(!silent)setStatus('Loading…');
  try{const res=await fetch(u+'/rest/v1/boards?code=eq.'+encodeURIComponent(c)+'&select=data',{headers:headers(k)});if(!res.ok)throw new Error();
    const rows=await res.json();if(!rows.length){if(!silent)setStatus('No saved data for that code yet. Tap Connect & save.');return;}
    data=Object.assign(blank(),rows[0].data);ITEMS.forEach(x=>{data.totals[x.key]??=28;data.due[x.key]??='';if(!Array.isArray(data.doses[x.key]))data.doses[x.key]=[];});
    rememberCfg(u,k,c);localStorage.setItem('trackerData',JSON.stringify(data));fillSetup();render();if(!silent)setStatus('Loaded.');}
  catch(e){if(!silent)setStatus('Load failed — check URL/key.');}}
async function push(u,k,c){try{await fetch(u+'/rest/v1/boards',{method:'POST',headers:headers(k,{'Prefer':'resolution=merge-duplicates'}),body:JSON.stringify({code:c,data})});}catch(e){}}

function closeModal(id){el(id).style.display='none';currentEdit=null;}
function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,6);}
function exportCSV(){const rows=allDoses().sort((a,b)=>new Date(a.ts)-new Date(b.ts));
  let csv='Type,Strength(mg),Date,Time,Timestamp\n';
  rows.forEach(r=>{const dt=new Date(r.ts);csv+=`${r.grp},${r.mg},${dt.toLocaleDateString('en-GB')},${dt.toLocaleTimeString('en-GB',{hour:'2-digit',minute:'2-digit'})},${r.ts}\n`;});
  let l=0,a=0;ITEMS.forEach(s=>{const m=data.doses[s.key].length*s.mg;if(s.grp==='L')l+=m;else a+=m;});
  csv+=`\nTotal L(mg),${l}\nTotal A(mg),${a}\nGrand total(mg),${l+a}\n`;
  const b=new Blob([csv],{type:'text/csv'});const uu=URL.createObjectURL(b);const link=document.createElement('a');link.href=uu;link.download='tracker-data.csv';link.click();URL.revokeObjectURL(uu);}
window.onclick=e=>{if(e.target.classList.contains('modal')){e.target.style.display='none';currentEdit=null;}};
</script>
